services:
  relay:
    environment:
      AUTH_GOOGLE_CLIENT_ID: ${LAPIS_AUTH_GOOGLE_CLIENT_ID:?set the Google OAuth client ID}
      AUTH_GOOGLE_CLIENT_SECRET_REF: file:lapis_auth_google_client_secret
    secrets:
      - lapis_auth_google_client_secret

  forge-worker:
    environment:
      AUTH_GOOGLE_CLIENT_ID: ${LAPIS_AUTH_GOOGLE_CLIENT_ID:?set the Google OAuth client ID}
      AUTH_GOOGLE_CLIENT_SECRET_REF: file:lapis_auth_google_client_secret
    secrets:
      - lapis_auth_google_client_secret

secrets:
  lapis_auth_google_client_secret:
    file: ${LAPIS_AUTH_GOOGLE_CLIENT_SECRET_FILE:?set the Google OAuth client-secret file}
