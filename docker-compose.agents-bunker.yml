services:
  relay:
    environment:
      AGENTS_BUNKER_ENABLED: "true"
      AGENTS_BUNKER_PUBLIC_URL: ${LAPIS_AGENT_BUNKER_PUBLIC_URL:?set the public relay URL}
      AGENTS_BUNKER_ALLOWED_BROWSER_ORIGINS: '${LAPIS_AGENT_BUNKER_ALLOWED_BROWSER_ORIGINS:-[]}'
      AGENTS_BUNKER_CREDENTIAL_DIR: /run/secrets
      AGENTS_BUNKER_MASTER_KEY_REF: file:lapis_agent_bunker_master_key
      AGENTS_BUNKER_MASTER_KEY_VERSION: ${LAPIS_AGENT_BUNKER_MASTER_KEY_VERSION:-v1}
      AGENTS_BUNKER_INVITATION_LIFETIME: ${LAPIS_AGENT_BUNKER_INVITATION_LIFETIME:-24h}
      AGENTS_BUNKER_MAX_ACTIVE_PER_OWNER: ${LAPIS_AGENT_BUNKER_MAX_ACTIVE_PER_OWNER:-10}
      AGENTS_BUNKER_MAX_PENDING_PER_OWNER: ${LAPIS_AGENT_BUNKER_MAX_PENDING_PER_OWNER:-3}
      AGENTS_BUNKER_CREATIONS_PER_HOUR: ${LAPIS_AGENT_BUNKER_CREATIONS_PER_HOUR:-5}
      AGENTS_BUNKER_REQUESTS_PER_MINUTE: ${LAPIS_AGENT_BUNKER_REQUESTS_PER_MINUTE:-120}
    secrets:
      - lapis_agent_bunker_master_key

  forge-worker:
    environment:
      AGENTS_BUNKER_ENABLED: "true"
      AGENTS_BUNKER_PUBLIC_URL: ${LAPIS_AGENT_BUNKER_PUBLIC_URL:?set the public relay URL}
      AGENTS_BUNKER_ALLOWED_BROWSER_ORIGINS: '${LAPIS_AGENT_BUNKER_ALLOWED_BROWSER_ORIGINS:-[]}'
      AGENTS_BUNKER_CREDENTIAL_DIR: /run/secrets
      AGENTS_BUNKER_MASTER_KEY_REF: file:lapis_agent_bunker_master_key
      AGENTS_BUNKER_MASTER_KEY_VERSION: ${LAPIS_AGENT_BUNKER_MASTER_KEY_VERSION:-v1}
      AGENTS_BUNKER_INVITATION_LIFETIME: ${LAPIS_AGENT_BUNKER_INVITATION_LIFETIME:-24h}
      AGENTS_BUNKER_MAX_ACTIVE_PER_OWNER: ${LAPIS_AGENT_BUNKER_MAX_ACTIVE_PER_OWNER:-10}
      AGENTS_BUNKER_MAX_PENDING_PER_OWNER: ${LAPIS_AGENT_BUNKER_MAX_PENDING_PER_OWNER:-3}
      AGENTS_BUNKER_CREATIONS_PER_HOUR: ${LAPIS_AGENT_BUNKER_CREATIONS_PER_HOUR:-5}
      AGENTS_BUNKER_REQUESTS_PER_MINUTE: ${LAPIS_AGENT_BUNKER_REQUESTS_PER_MINUTE:-120}
    secrets:
      - lapis_agent_bunker_master_key

secrets:
  lapis_agent_bunker_master_key:
    file: ${LAPIS_AGENT_BUNKER_MASTER_KEY_FILE:?set the managed-agent bunker master-key file}
