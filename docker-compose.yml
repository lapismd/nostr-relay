services:
  relay:
    image: lapis-relay:local
    build: .
    environment:
      DATABASE_URL: postgres://lapis_relay:dev@postgres:5432/lapis_relay?sslmode=disable
      RELAY_HOST: ${LAPIS_RELAY_HOST:-registry.localhost:8281}
      RELAY_SCHEMA: lapis_registry
      RELAY_SECRET: ${LAPIS_RELAY_SECRET:?set an ephemeral local relay secret}
      RELAY_PUBKEY: ${LAPIS_RELAY_OWNER_PUBKEY:?set the matching local relay owner pubkey}
      ADMIN_PUBKEYS: ${LAPIS_RELAY_ADMIN_PUBKEYS:?set a TOML-formatted local admin pubkey list}
      POLICY_OPEN: "true"
      POLICY_ANONYMOUS_READ: "true"
      POLICY_PUBLIC_JOIN: "true"
      GROUPS_AUTO_JOIN: "true"
      GROUPS_ADMIN_CREATE_ONLY: "true"
      GROUPS_PRIVATE_ADMIN_ONLY: "true"
      GROUPS_PRIVATE_RELAY_ADMIN_ACCESS: "false"
      BLOSSOM_ENABLED: "true"
      REGISTRY_POLICY_ENABLED: ${LAPIS_REGISTRY_POLICY_ENABLED:-false}
      REGISTRY_RELEASE_GROUP_ID: ${LAPIS_REGISTRY_RELEASE_GROUP_ID:-}
      REGISTRY_CURATOR_ROLE: ${LAPIS_REGISTRY_CURATOR_ROLE:-registry-curator}
      GIT_ENABLED: ${LAPIS_GIT_ENABLED:-true}
      GIT_PUBLIC_URL: ${LAPIS_GIT_PUBLIC_URL:-http://localhost:8281}
      GIT_BACKEND_URL: http://walgit:8080
      GIT_RECONCILE_INTERVAL: ${LAPIS_GIT_RECONCILE_INTERVAL:-2s}
      GIT_MAX_DIFF_BYTES: ${LAPIS_GIT_MAX_DIFF_BYTES:-8388608}
      GIT_MAX_DIFF_FILES: ${LAPIS_GIT_MAX_DIFF_FILES:-2000}
      GITHUB_ENABLED: ${LAPIS_GITHUB_ENABLED:-false}
      GITHUB_CREDENTIAL_DIR: /run/secrets
      GITHUB_WORKER_INTERVAL: ${LAPIS_GITHUB_WORKER_INTERVAL:-2s}
      GITHUB_RECONCILE_INTERVAL: ${LAPIS_GITHUB_RECONCILE_INTERVAL:-5m}
      GITHUB_MAX_WEBHOOK_BYTES: ${LAPIS_GITHUB_MAX_WEBHOOK_BYTES:-4194304}
      FORGE_WORKER_MODE: ${LAPIS_FORGE_WORKER_MODE:-embedded}
      WALGIT_RELAY_TOKEN: ${LAPIS_WALGIT_RELAY_TOKEN:?set a random local relay-to-WalGit token}
      WALGIT_WEBHOOK_SECRET: ${LAPIS_WALGIT_WEBHOOK_SECRET:?set a random local WalGit webhook secret}
    ports:
      - "${LAPIS_RELAY_PORT:-8281}:3334"
    volumes:
      - relay-config:/app/config
      - relay-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      walgit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3334/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  forge-worker:
    profiles: ["external-forge-worker"]
    image: lapis-forge-worker:local
    build:
      context: .
      target: forge-worker
    environment:
      DATABASE_URL: postgres://lapis_relay:dev@postgres:5432/lapis_relay?sslmode=disable
      RELAY_HOST: ${LAPIS_RELAY_HOST:-registry.localhost:8281}
      RELAY_SCHEMA: lapis_registry
      RELAY_SECRET: ${LAPIS_RELAY_SECRET:?set an ephemeral local relay secret}
      RELAY_PUBKEY: ${LAPIS_RELAY_OWNER_PUBKEY:?set the matching local relay owner pubkey}
      ADMIN_PUBKEYS: ${LAPIS_RELAY_ADMIN_PUBKEYS:?set a TOML-formatted local admin pubkey list}
      POLICY_OPEN: "true"
      POLICY_ANONYMOUS_READ: "true"
      POLICY_PUBLIC_JOIN: "true"
      GROUPS_AUTO_JOIN: "true"
      GROUPS_ADMIN_CREATE_ONLY: "true"
      GROUPS_PRIVATE_ADMIN_ONLY: "true"
      GROUPS_PRIVATE_RELAY_ADMIN_ACCESS: "false"
      BLOSSOM_ENABLED: "true"
      REGISTRY_POLICY_ENABLED: ${LAPIS_REGISTRY_POLICY_ENABLED:-false}
      REGISTRY_RELEASE_GROUP_ID: ${LAPIS_REGISTRY_RELEASE_GROUP_ID:-}
      REGISTRY_CURATOR_ROLE: ${LAPIS_REGISTRY_CURATOR_ROLE:-registry-curator}
      GIT_ENABLED: ${LAPIS_GIT_ENABLED:-true}
      GIT_PUBLIC_URL: ${LAPIS_GIT_PUBLIC_URL:-http://localhost:8281}
      GIT_BACKEND_URL: http://walgit:8080
      GIT_RECONCILE_INTERVAL: ${LAPIS_GIT_RECONCILE_INTERVAL:-2s}
      GIT_MAX_DIFF_BYTES: ${LAPIS_GIT_MAX_DIFF_BYTES:-8388608}
      GIT_MAX_DIFF_FILES: ${LAPIS_GIT_MAX_DIFF_FILES:-2000}
      GITHUB_ENABLED: ${LAPIS_GITHUB_ENABLED:-false}
      GITHUB_CREDENTIAL_DIR: /run/secrets
      GITHUB_WORKER_INTERVAL: ${LAPIS_GITHUB_WORKER_INTERVAL:-2s}
      GITHUB_RECONCILE_INTERVAL: ${LAPIS_GITHUB_RECONCILE_INTERVAL:-5m}
      GITHUB_MAX_WEBHOOK_BYTES: ${LAPIS_GITHUB_MAX_WEBHOOK_BYTES:-4194304}
      FORGE_WORKER_MODE: only
      WALGIT_RELAY_TOKEN: ${LAPIS_WALGIT_RELAY_TOKEN:?set a random local relay-to-WalGit token}
      WALGIT_WEBHOOK_SECRET: ${LAPIS_WALGIT_WEBHOOK_SECRET:?set a random local WalGit webhook secret}
    volumes:
      - relay-config:/app/config
      - relay-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      walgit:
        condition: service_healthy
    restart: unless-stopped

  walgit:
    image: lapis-walgit:local
    build:
      context: .
      dockerfile: third_party/walgit/Containerfile
      args:
        WALGIT_COMMIT: e5295e6ee45f5267c661f8bbd27ed0a07e55e7db
        WALGIT_ARCHIVE_SHA256: 9bb48e21c5647950e158068e1999bcb85cbae08c2730a5c3771b05259ec9d1ef
    environment:
      WALGIT_RELAY_TOKEN: ${LAPIS_WALGIT_RELAY_TOKEN:?set a random local relay-to-WalGit token}
      WALGIT__EVENTS__WEBHOOK_SECRET: ${LAPIS_WALGIT_WEBHOOK_SECRET:?set a random local WalGit webhook secret}
      WALGIT__SERVER__PUBLIC_URL: ${LAPIS_GIT_PUBLIC_URL:-http://localhost:8281}
      AWS_ACCESS_KEY_ID: ${LAPIS_RUSTFS_ACCESS_KEY:?set a random local RustFS access key}
      AWS_SECRET_ACCESS_KEY: ${LAPIS_RUSTFS_SECRET_KEY:?set a random local RustFS secret key}
    volumes:
      - walgit-cache:/var/lib/walgit
    depends_on:
      create-walgit-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs@sha256:b7014e0ce2bc703c1316b3ef760e29dfae61fe4a50d1a66fa89638e0f8ea211f
    environment:
      RUSTFS_ACCESS_KEY: ${LAPIS_RUSTFS_ACCESS_KEY:?set a random local RustFS access key}
      RUSTFS_SECRET_KEY: ${LAPIS_RUSTFS_SECRET_KEY:?set a random local RustFS secret key}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  create-walgit-bucket:
    image: amazon/aws-cli@sha256:b6aeb95d19d7f5a8cae4eb814cb16739b6b2a4f2f46f427ada6a8c9a20d9881d
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${LAPIS_RUSTFS_ACCESS_KEY:?set a random local RustFS access key}
      AWS_SECRET_ACCESS_KEY: ${LAPIS_RUSTFS_SECRET_KEY:?set a random local RustFS secret key}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket lapis-walgit
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket lapis-walgit
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lapis_relay
      POSTGRES_USER: lapis_relay
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapis_relay -d lapis_relay"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  relay-config:
  relay-media:
  walgit-cache:
  rustfs-data:
