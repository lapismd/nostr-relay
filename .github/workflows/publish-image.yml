name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lapis-relay
  TESTCONTAINERS_RYUK_DISABLED: "true"
  CANDIDATE_IMAGE: lapis-relay:candidate

jobs:
  verify:
    name: Format, unit, specification, patch, integration, and image checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            modules/buzzagents/go.sum

      - name: Install mdBook
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: mdbook@0.5.4

      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify specification links
        shell: bash
        run: GOWORK=off go test ./internal/specdocs

      - name: Run unit tests
        shell: bash
        run: |
          (cd modules/buzzagents && GOWORK=off go test ./...)
          GOWORK=off go test ./...

      - name: Verify upstream patch queues
        shell: bash
        run: |
          ./scripts/update-khatru.sh --check
          ./scripts/update-buzz-agent-upstream.sh --check

      - name: Build specification
        shell: bash
        run: mdbook build spec

      - name: Run NIP-29 integration tests
        shell: bash
        run: GOWORK=off go test -tags=integration ./zooid/ -count=1

      - name: Run fake GitHub forge Docker lane
        shell: bash
        run: >-
          GOWORK=off go test -tags=github_integration ./zooid/
          -run '^TestGitHubForgeDockerLane$' -count=1

      - name: Run WalGit object-store recovery lane
        shell: bash
        run: >-
          GOWORK=off go test -tags=walgit_integration ./zooid/
          -run '^TestWalGitObjectStoreRecovery$' -count=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Build the candidate relay image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: relay
          load: true
          push: false
          pull: true
          platforms: linux/amd64
          tags: ${{ env.CANDIDATE_IMAGE }}
          provenance: false

      - name: Reject fixable high and critical runtime vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            --cache-dir /tmp/trivy image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            "${CANDIDATE_IMAGE}"

  publish:
    name: Publish signed build evidence
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize the registry path
        shell: bash
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: relay
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      - name: Publish GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify the image is anonymously readable
        shell: bash
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >/dev/null
