name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            modules/buzzagents/go.sum

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        env:
          # Ryuk is the testcontainers reaper. The GHA runner is ephemeral
          # and TestMain already calls Terminate(), so we don't need it,
          # and disabling avoids a class of intermittent CI flakes.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          (cd modules/buzzagents && GOWORK=off go test ./...)
          GOWORK=off go test ./...

      - name: Verify upstream patch queues
        run: |
          ./scripts/update-khatru.sh --check
          ./scripts/update-buzz-agent-upstream.sh --check

      - name: Build specification
        run: mdbook build spec
