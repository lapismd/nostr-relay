name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"
  CANDIDATE_IMAGE: lapis-relay:candidate

jobs:
  verify:
    name: Format, unit, specification, and patch checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            modules/buzzagents/go.sum

      - name: Install mdBook
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: mdbook@0.5.4

      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify specification links
        shell: bash
        run: GOWORK=off go test ./internal/specdocs

      - name: Run unit tests
        shell: bash
        run: |
          (cd modules/buzzagents && GOWORK=off go test ./...)
          GOWORK=off go test ./...

      - name: Verify upstream patch queues
        shell: bash
        run: |
          ./scripts/update-khatru.sh --check
          ./scripts/update-buzz-agent-upstream.sh --check

      - name: Build specification
        shell: bash
        run: mdbook build spec

  integration:
    name: Tagged Docker integration lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            modules/buzzagents/go.sum

      - name: Run NIP-29 integration tests
        shell: bash
        run: GOWORK=off go test -tags=integration ./zooid/ -count=1

      - name: Run fake GitHub forge Docker lane
        shell: bash
        run: >-
          GOWORK=off go test -tags=github_integration ./zooid/
          -run '^TestGitHubForgeDockerLane$' -count=1

      - name: Run WalGit object-store recovery lane
        shell: bash
        run: >-
          GOWORK=off go test -tags=walgit_integration ./zooid/
          -run '^TestWalGitObjectStoreRecovery$' -count=1

  image:
    name: Candidate image and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Build the candidate relay image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: relay
          load: true
          push: false
          pull: true
          platforms: linux/amd64
          tags: ${{ env.CANDIDATE_IMAGE }}
          provenance: false

      - name: Reject fixable high and critical runtime vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            --cache-dir /tmp/trivy image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            "${CANDIDATE_IMAGE}"
