name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"
  CANDIDATE_IMAGE: lapis-relay:candidate

jobs:
  verify:
    name: Format, unit, specification, and patch checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pinned CI toolchain image
        shell: bash
        run: ./scripts/ci-images.sh toolchain

      - name: Run verify gates
        shell: bash
        run: ./scripts/ci-in-image.sh ./scripts/ci-verify.sh

  integration:
    name: Tagged Docker integration lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            modules/buzzagents/go.sum

      - name: Build reusable Docker fixture images
        shell: bash
        run: ./scripts/ci-images.sh fixtures

      - name: Run tagged Docker integration lanes
        shell: bash
        run: ./scripts/ci-integration.sh

  image:
    name: Candidate image and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the candidate image and reject fixable vulnerabilities
        shell: bash
        run: ./scripts/ci-image.sh
